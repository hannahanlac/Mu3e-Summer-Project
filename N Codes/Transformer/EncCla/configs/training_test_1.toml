# example toml
[experiment]
name = "experiment_signal1_96_test_csv"
description = "run set 1"

[data]
data_dir = "/root/Mu3eProject/RawData/TransformerData/TrainingDataT2/signal1_96/"
train_file = "signal1_96_sorted_train.pt"
val_file = "signal1_96_sorted_val.pt"
test_file = "signal1_96_sorted_test.pt"
test_helperfile = "signal1_96_test_helper.pt"
test_truthfile = "signal1_96_test_truths_shuffled.csv"
dataloader_num_workers = 4
num_classes = 5400

[model]
inputfeature_dim = 3
num_heads = 8
embed_dim = 128 
num_layers = 6
dropout = 0.1
use_flash_attention = true


[training]
batch_size = 32
total_epochs = 1
shuffle = false # whether training data should be shuffled
start_from_scratch = true

[training.scheduler]
# type is only ReduceOnPlateau atm
warmup_epochs = 1
initial_lr = 1e-4
target_lr = 1e-3
mode = "min"
factor = 0.5
patience = 10
verbose = true

[training.early_stopping]
patience = 7
verbose = true  


[output]
base_path = "/root/Mu3eProject/RawData/TransformerData/results/"
output = "signal1_96_test_more_epochs"

[logging]
level = "INFO"
epoch_log_interval = 2
model_save_interval = 50

[wandb]
project_name = "Transformer_tracking"
run_name = "signal1_96_test_csv"
watch_interval = 20